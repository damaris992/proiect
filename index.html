<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ 2048 Pink Edition ✨</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&family=Pacifico&display=swap" rel="stylesheet">
</head>

<body>

<h1 class="title">✨ 2048 Pink Edition ✨</h1>

<div class="top-bar">
  <div>Score: <span id="score">0</span></div>
  <div>Best: <span id="best">0</span></div>
  <div>Time: <span id="timer">0</span>s</div>
  <div>Level: <span id="level">1</span></div>
</div>

<div id="controls">
<button onclick="startGame()">▶ Start</button>
<button onclick="pauseGame()">⏸ Pause</button>
<button onclick="undoMove()">↩ Undo</button>
<button onclick="saveGame()">💾 Save</button>
<button onclick="loadGame()">🔄 Load</button>
</div>

<div id="game-wrapper">
  <div class="grid" id="grid"></div>
</div>

<div class="overlay" id="pauseScreen" onclick="pauseGame()">
  <div class="pause-box" onclick="event.stopPropagation()">
    <h2>Paused</h2>
    <button onclick="pauseGame()">▶ Resume</button>
  </div>
</div>

<div class="overlay" id="gameOverScreen">
  <div class="gameover-box">
    <div class="gameover-title">GAME OVER</div>
    <button onclick="startGame()">Retry</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
